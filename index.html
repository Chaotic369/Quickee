<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<title>Quick Launcher – Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#ececec; --dim:rgba(200,200,200,.55); --faint:rgba(255,255,255,.06);
  --acc:#b3202b; --bg:#050505; --panel:#0d0d0d;
}
#navBar{position:absolute;bottom:0;left:0;right:0;height:48px;z-index:95;display:flex;align-items:center;justify-content:space-around;background:rgba(8,8,8,.92);border-top:1px solid rgba(255,255,255,.07)}
.nav-btn{width:48px;height:48px;display:grid;place-items:center;color:var(--dim);font-size:15px;transition:all .15s}
.nav-btn:hover{color:var(--ink)}
.nav-btn:active{transform:scale(.85);color:var(--acc)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08060c;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{display:grid;place-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);outline:none}

#phone{position:relative;width:100vw;height:100dvh;max-width:430px;overflow:hidden;background:#000;isolation:isolate}
#phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:92px;height:24px;border-radius:20px;background:#000;z-index:8;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
#phone.landscape{max-width:92dvh;height:min(420px,94dvh)}
@media (min-width:500px){#phone{height:min(900px,96dvh);border-radius:44px;box-shadow:0 0 0 10px #1a1628,0 0 0 12px #2d2642,0 35px 85px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.1)}}
#phone.mask-circle .ic{border-radius:50% !important}
#phone.mask-squircle .ic{border-radius:32% !important}
#phone.mask-square .ic{border-radius:18% !important}
#ctxMenu{position:absolute;z-index:96;display:none;flex-direction:column;min-width:145px;background:rgba(18,18,22,.96);border:1px solid rgba(255,255,255,.12);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.8);padding:5px;gap:2px}
#ctxMenu.open{display:flex}
.ctx-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .12s}
.ctx-item:hover{background:rgba(255,255,255,.08)}
.ctx-item i{font-size:12px;width:15px;color:var(--acc)}

/* ───── home ───── */
#dim{position:absolute;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none;transition:opacity .15s}
#status{position:absolute;top:0;left:0;right:0;height:34px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;pointer-events:none}
#status .r{display:flex;gap:8px;align-items:center;font-size:11px}
#home{position:absolute;inset:0;z-index:2;padding:56px 22px 0}
#clock{font-size:78px;line-height:0.95;font-weight:200;letter-spacing:-4px;text-shadow:0 6px 24px rgba(0,0,0,.35);background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#date{margin-top:8px;font-size:13.5px;color:rgba(246,239,228,.85);font-weight:500;letter-spacing:.2px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
#homeGrid{margin-top:36px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.hi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ic{border:none !important;outline:none !important}
.hi .ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:22px;color:#fff;border:none;outline:none;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .15s cubic-bezier(.2,0,0,1)}
.hi:active .ic{transform:scale(.9)}
#dock{position:absolute;left:14px;right:14px;bottom:26px;height:76px;border-radius:30px;z-index:2;background:rgba(12,12,12,.75);border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 36px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);display:flex;justify-content:space-around;align-items:center}
#dock .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:21px;color:#fff;border:none;outline:none;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .15s cubic-bezier(.2,0,0,1)}
#dock .ic:active{transform:scale(.9)}
#navpill{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4.5px;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:6}

/* ───── side line trigger & external floating controls ───── */
#fab{position:absolute;z-index:45;width:var(--trig-w,6px);height:var(--trig-h,90px);border-radius:4px 0 0 4px;touch-action:none;user-select:none;
  background:rgba(255,255,255,.32);box-shadow:none;transition:width .18s,background .2s;color:transparent}
#fab i{display:none}
#fab:hover,#fab:active,#fab.open{width:calc(var(--trig-w,6px) + 4px);background:rgba(255,255,255,.55);box-shadow:none}
.fbtn{position:absolute;z-index:45;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;color:var(--ink);
  background:rgba(18,18,18,.96);box-shadow:0 0 0 1px rgba(255,255,255,.08);
  opacity:0;pointer-events:none;transform:scale(.7);transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.34,1.56,.64,1),color .15s}
.fbtn.open{opacity:1;pointer-events:auto;transform:scale(1)}
.fbtn.open:hover{transform:scale(1.3);z-index:55}
.fbtn:active{transform:scale(.95)}
.fbtn.on{color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
#fabAdd{display:none}
#fabAdd.show{display:grid}
.dt-ring{position:absolute;z-index:999;width:var(--ring-sz,52px);height:var(--ring-sz,52px);border-width:var(--ring-th,2.5px);border-style:solid;border-color:var(--ring-col,rgba(255,255,255,.38));border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;background:transparent !important;box-shadow:none}
.grid-cell:has(.drag-over),.grid-cell:has(:hover){z-index:25}
.it:hover,.it.drag-over{z-index:30}
.it:hover .ic,.it.drag-over .ic{transform:scale(1.35);border:none;outline:none;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform 0s,box-shadow 0s !important;z-index:30}
#scrim{position:absolute;inset:0;z-index:38;display:none}
#scrim.on{display:block}

/* ───── popup ───── */
#pop{
  --icon:50px;--rad:30;--cols:4;--cgap:10px;--rgap:14px;--pad:14px;--lbl:10.5px;--glass:.88;--pop-rad:26px;--pop-blur:0px;
  position:absolute;z-index:40;display:flex;flex-direction:column;overflow:hidden;border:none !important;
  border-radius:var(--pop-rad);background:var(--pop-bg,rgba(0,0,0,var(--glass)));
  box-shadow:0 26px 70px rgba(0,0,0,.92);
  box-sizing:border-box;
  opacity:0;transform:scale(.92) translateX(12px);pointer-events:none;transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1)}
#pop.solid-black{background:#000 !important;box-shadow:0 26px 70px rgba(0,0,0,1) !important}
#pop.open{opacity:1;transform:none;pointer-events:auto}
.top-bar{display:flex;align-items:center;gap:8px;padding:10px var(--pad) 0;flex-shrink:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.mbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;color:var(--dim);transition:all .15s;flex-shrink:0}
.mbtn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.mbtn.on{background:rgba(179,32,43,.3);color:var(--acc)}
.menu-pop{position:absolute;top:calc(var(--pad) + 38px);right:var(--pad);z-index:50;min-width:180px;background:rgba(14,14,14,.98);border:1px solid rgba(255,255,255,.08);border-radius:18px;box-shadow:0 16px 36px rgba(0,0,0,.85);padding:6px;display:none;flex-direction:column;gap:2px}
.menu-pop.open{display:flex}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--ink);transition:background .12s;text-align:left;width:100%}
.menu-item:hover{background:rgba(255,255,255,.08)}
.menu-item:active{background:rgba(179,32,43,.3);color:var(--acc)}
.menu-item i{width:16px;text-align:center;font-size:13px;color:var(--acc)}
.menu-sep{height:1px;background:rgba(255,255,255,.06);margin:4px 0}
.set-hdr{display:flex;align-items:center;gap:10px;padding:4px 0 14px;margin-bottom:14px;font-size:13.5px;font-weight:700}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);transition:all .15s}
.chip:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:var(--pad);scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
#grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));column-gap:var(--cgap);row-gap:var(--rgap);width:100%;align-items:start}
.grid-cell{position:relative;width:100%;min-height:calc(var(--icon) + 20px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.edit .grid-cell{border-radius:calc(var(--icon)*var(--rad)/100 + 4px);background:transparent}
.edit .grid-cell.cell-over .cell-add{border-color:var(--acc);background:rgba(179,32,43,.25);color:var(--acc)}
.cell-add{display:none;width:var(--icon);height:var(--icon);aspect-ratio:1;border-radius:calc(var(--icon)*var(--rad)/100);place-items:center;color:rgba(255,255,255,.4);font-size:16px;cursor:pointer;border:1.5px dashed rgba(255,255,255,.15);background:rgba(255,255,255,.02);transition:all .15s}
.cell-add:hover{color:var(--acc);border-color:var(--acc);background:rgba(179,32,43,.2)}
.edit .grid-cell.empty-slot .cell-add{display:grid}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:100%;cursor:pointer}
.it .ic{position:relative;width:var(--icon);height:var(--icon);aspect-ratio:1;border-radius:calc(var(--icon)*var(--rad)/100);display:grid;place-items:center;color:#fff;font-size:calc(var(--icon)*.44);border:none;outline:none;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .18s cubic-bezier(.25,1,.5,1),box-shadow .18s ease;overflow:hidden;flex-shrink:0}
.it .ic .fav-wrap{width:100%;height:100%;display:grid;place-items:center;border-radius:inherit}
.it .ic .fav-wrap img{width:56%;height:56%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));border-radius:4px;pointer-events:none}
.it .ic b{font-weight:700;font-size:calc(var(--icon)*.46)}
.it:active .ic{transform:scale(.95)}
.it .lb{max-width:100%;font-size:var(--lbl);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;font-weight:500;color:rgba(246,239,228,.9)}
.nolbl .it .lb{display:none}
.it.on .ic{box-shadow:0 0 0 2.5px var(--acc),0 6px 16px rgba(0,0,0,.35)}
.it.lift{opacity:.25}
.it .x{display:none;position:absolute;top:-4px;right:calc(50% - var(--icon)/2 - 4px);width:16px;height:16px;border-radius:50%;background:#e5534b;color:#fff;font-size:9px;place-items:center;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.5);border:1px solid #1b1629;cursor:pointer}
.it .ed{display:none;position:absolute;top:calc(var(--icon) - 12px);right:calc(50% - var(--icon)/2 - 4px);width:16px;height:16px;border-radius:50%;background:#1e1a2b;color:#fff;font-size:8.5px;place-items:center;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.5);border:1px solid #2d2642;cursor:pointer;transition:transform .12s}
.it .ed:active{transform:scale(.9)}
.edit .it .x,.edit .it .ed{display:grid}
.edit .it .ic{animation:none}
@media (prefers-reduced-motion:reduce){.edit .it .ic{animation:none}#pop,#fab i{transition:none}}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:scale(1.15);filter:drop-shadow(0 16px 24px rgba(0,0,0,.6))}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:13px;padding:26px 8px;line-height:1.5}

.res{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;transition:background .12s;cursor:pointer}
.res:hover{background:rgba(255,255,255,.05)}
.res:active{background:rgba(255,255,255,.1)}
.res .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:16px;flex-shrink:0;border:none;outline:none;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.res .tx{flex:1;min-width:0}
.res .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tx small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.res .pin{width:32px;height:32px;border-radius:10px;color:var(--dim);font-size:12px;display:grid;place-items:center;transition:all .12s}
.res .pin:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.res .pin:active{background:rgba(179,32,43,.3);color:var(--acc)}
.rh{font-size:11px;color:var(--dim);font-weight:600;padding:8px 6px 2px}

#settings{display:none}
.sg{margin-bottom:14px}
.sg .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;margin-bottom:6px}
.sg .row span:last-child{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:6px;background:rgba(255,255,255,.15)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ffbf00;margin-top:-6.5px;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 2px rgba(20,16,31,.9)}
input[type=range]::-moz-range-track{height:5px;border-radius:6px;background:rgba(255,255,255,.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:2px solid rgba(20,16,31,.9);border-radius:50%;background:#ffbf00;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:500;margin:10px 0 16px;padding-top:6px}
.tg{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,0,0,1)}
.tg.on{background:#ffbf00}.tg.on::after{transform:translateX(20px);background:#fff}
.sbtn{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.09);font-size:12.5px;font-weight:600;margin-right:8px;transition:all .15s}
.sbtn:hover{background:rgba(255,255,255,.15);color:#fff}
.sbtn:active{transform:scale(.96)}
.rz{position:absolute;width:calc(var(--pop-rad, 26px) + 6px);height:calc(var(--pop-rad, 26px) + 6px);touch-action:none;cursor:nesw-resize;z-index:90;display:none;align-items:center;justify-content:center;transition:transform .15s,opacity .15s;background:transparent;border:none;box-shadow:none;border-radius:0}
.rz::after{content:"";position:absolute;inset:0;pointer-events:none;border-bottom:3px solid var(--acc);border-bottom-left-radius:var(--pop-rad, 26px);filter:drop-shadow(0 2px 5px rgba(0,0,0,.9));transition:border-color .15s,border-width .15s}
#phone.edge-left .rz::after{border-bottom-left-radius:0;border-bottom-right-radius:var(--pop-rad, 26px);border-left:none;border-right:3px solid var(--acc)}
#phone:not(.edge-left) .rz::after{border-left:3px solid var(--acc);border-right:none}
.rz:hover,.rz:active{transform:scale(1.12)}
.rz:hover::after,.rz:active::after{border-color:#fff}
.trig-handle{display:none;position:absolute;right:100%;z-index:48;touch-action:none;user-select:none;align-items:center;justify-content:center;color:#fff}
.trig-handle.end-cap{width:22px;height:24px;background:#3a3842;border:1px solid rgba(255,255,255,.2);clip-path:polygon(0% 25%, 65% 25%, 100% 50%, 65% 75%, 0% 75%);cursor:ns-resize}
.trig-handle.top-cap{top:-12px}
.trig-handle.bot-cap{bottom:-12px}
.trig-handle.width-tab{top:50%;transform:translateY(-50%);width:26px;height:26px;background:transparent;cursor:ew-resize;font-size:13px;letter-spacing:-1px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.edit #fab .trig-handle{display:flex}
.pop-bottom-bar{display:none;position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:46px;height:14px;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize;z-index:50;user-select:none}
.pop-bottom-bar::after{content:"";width:32px;height:4.5px;border-radius:3px;background:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.edit #pop .pop-bottom-bar{display:flex}

/* ───── Zone Launcher overflow scroll chevrons ───── */
.pop-scroll-arrow{position:absolute;left:50%;transform:translateX(-50%);width:36px;height:22px;display:none;align-items:center;justify-content:center;color:#fff;font-size:15px;z-index:45;pointer-events:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.85));transition:transform .12s,color .15s}
.pop-scroll-arrow.arr-top{top:4px}
.pop-scroll-arrow.arr-bot{bottom:4px}
.pop-scroll-arrow.visible{display:flex}
.pop-scroll-arrow.arr-top.active{color:var(--acc);transform:translateX(-50%) translateY(-2px) scale(1.25)}
.pop-scroll-arrow.arr-bot.active{color:var(--acc);transform:translateX(-50%) translateY(2px) scale(1.25)}

/* ───── simulated app window ───── */
#sim{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s}
#sim.on{transform:none;opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;gap:12px;padding:44px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sh .sb{width:36px;height:36px;border-radius:12px;background:var(--faint);transition:background .15s}
.sh .sb:hover{background:rgba(255,255,255,.16)}
.sh .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:16px;border:none;outline:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sh .st b{display:block;font-size:15px}.sh .st small{display:block;font-size:11px;color:var(--dim);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{flex:1;overflow-y:auto;padding:6px 16px 16px}
.nat{padding:10px 16px 18px;font-size:10.5px;color:var(--dim);background:rgba(255,255,255,.04);line-height:1.4}
.nat b{color:var(--acc);font-weight:600}
.crumb{font-size:11.5px;color:var(--dim);padding:4px 0 10px;word-break:break-all}
.skel{height:14px;border-radius:7px;background:rgba(255,255,255,.08);margin:10px 0}
.card{border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bigbtn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .12s}
.bigbtn:active{transform:scale(.96)}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;margin:6px 0;font-size:13.5px;line-height:1.35}
.bub.me{margin-left:auto;background:#2fb872;color:#04210f;border-bottom-right-radius:4px}
.bub.th{background:rgba(255,255,255,.1);border-bottom-left-radius:4px}
.cinput{display:flex;gap:8px;padding:10px 12px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.06)}

function startAutoScroll(dir){

  scrollTimer=setInterval(()=>{
    const filledH=maxFilledBottom();
    const maxAllowedScroll=Math.max(0, filledH - pbody.clientHeight + (st.set.pad||10));
    if(dir>0){
      if(pbody.scrollTop>=maxAllowedScroll||pbody.scrollHeight-(pbody.scrollTop+pbody.clientHeight)<=2){

        updateScrollArrow();
        return;
      }
      pbody.scrollTop=Math.min(maxAllowedScroll, pbody.scrollTop+8);

      if(pbody.scrollTop<=0){

      pbody.scrollTop=Math.max(0, pbody.scrollTop-8);

let trgDrag=null;
function bindTrigResize(el, mode){
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    trgDrag={mode,y:e.clientY,x:e.clientX,h:st.set.trigH||90,w:st.set.trigW||6};
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!trgDrag||trgDrag.mode!==mode)return;
    if(mode==='width'){
      const diffX=trgDrag.x-e.clientX;
      st.set.trigW=Math.round(clamp(trgDrag.w+diffX,3,32));
    }else{
      const diffY=(mode==='top'?(trgDrag.y-e.clientY):(e.clientY-trgDrag.y))*2;
      st.set.trigH=Math.round(clamp(trgDrag.h+diffY,36,280));
    }
    applySet();
    placeFab();
    if(stOn()){syncSl();pvUpdate();}
  });
  el.addEventListener('pointerup',e=>{
    if(trgDrag&&trgDrag.mode===mode){
      trgDrag=null;
      save();
      toast(mode==='width'?'Trigger width updated':'Trigger height updated');
    }
  });
  el.addEventListener('pointercancel',()=>{trgDrag=null});
}

function endDrag(){

/* ───────── folder tree: hover or tap a folder shortcut to browse its contents ───────── */
let tree=null,treeDwell=null,treeDwellId=null,treeHoverT=null,treeScrollT=null,treeScrollDir=0,treeLast={x:0,y:0};
const treeView=document.createElement('div');
treeView.id='treeView';
pbody.appendChild(treeView);

function treeRows(dir,depth,out){
  const k=kids(dir);
  k.dirs.forEach(d=>{
    const o=tree.open.has(d);
    out.push({t:'d',p:d,depth:depth,open:o});
    if(o)treeRows(d,depth+1,out);
  });
  k.files.forEach(f=>out.push({t:'f',p:f,depth:depth}));
  return out;
}
function treeApplyHl(){
  if(!tree)return;
  treeView.querySelectorAll('.tv-row,.tv-btn').forEach(n=>n.classList.toggle('hl',(n.dataset.tp||n.dataset.tv)===tree.hl));
}
function renderTree(){
  if(!tree)return;
  const rows=treeRows(tree.root,0,[]);
  let html='<div class="tv-hdr"><button type="button" class="tv-btn" data-tv="back" title="Back to grid" aria-label="Back to grid"><i class="fa-solid fa-chevron-left"></i></button><div class="tv-title"><b>'+esc(tree.name||'Folder')+'</b><small>'+esc(tree.root.replace(ROOT.slice(0,-1),'Internal storage'))+'</small></div><button type="button" class="tv-btn" data-tv="ext" title="Open in file manager" aria-label="Open in file manager"><i class="fa-solid fa-arrow-up-right-from-square"></i></button></div>';
  html+=rows.map(r=>{
    const isD=r.t==='d';
    return '<div class="tv-row'+(isD?' dir':'')+'" data-tp="'+esc(r.p)+'" data-tt="'+r.t+'" style="padding-left:'+(8+r.depth*16)+'px"><i class="tv-car'+(isD?' fa-solid '+(r.open?'fa-chevron-down':'fa-chevron-right'):'')+'"></i><span class="tv-ic"><i class="'+(isD?(r.open?'fa-solid fa-folder-open':'fa-solid fa-folder'):fileIcon(r.p))+'"></i></span><span class="tv-nm">'+esc(r.p.split('/').pop())+'</span></div>';
  }).join('');
  if(!rows.length)html+='<div class="empty">Empty folder</div>';
  treeView.innerHTML=html;
  treeApplyHl();
}
function enterTree(item){
  if(!item||editMode)return;
  clearTimeout(treeDwell);treeDwell=null;treeDwellId=null;
  document.querySelectorAll('.it.drag-over').forEach(i=>i.classList.remove('drag-over'));
  lastHoveredDragItem=null;
  tree={root:String(item.v||'').replace(/\/+$/,''),name:item.n,open:new Set(),hl:null};
  grid.style.display='none';
  treeView.style.display='flex';
  pbody.scrollTop=0;
  renderTree();
  updateScrollArrow();
  haptic('pop');
}
function resetTree(){
  clearTimeout(treeDwell);treeDwell=null;treeDwellId=null;
  clearTimeout(treeHoverT);treeHoverT=null;
  clearInterval(treeScrollT);treeScrollT=null;treeScrollDir=0;
  if(!tree)return;
  tree=null;
  treeView.style.display='';
  treeView.innerHTML='';
  grid.style.display='';
  pbody.scrollTop=0;
  updateScrollArrow();
}
function treeAction(a){
  if(!tree)return;
  if(a==='back'){haptic('tick');resetTree();return}
  if(a==='ext'){const d=tree.root;haptic('confirm');openFolder(d)}
}
function treeRowAct(row,how){
  if(!tree)return;
  const p=row.dataset.tp;
  if(row.dataset.tt==='d'){
    if(how==='tap'){
      if(tree.open.has(p))tree.open.delete(p);else tree.open.add(p);
      haptic('tick');
      renderTree();
    }else{
      haptic('confirm');
      openFolder(p);
    }
  }else{
    haptic('confirm');
    openFile(p);
  }
}
treeView.addEventListener('click',e=>{
  if(!tree)return;
  const b=e.target.closest('[data-tv]');
  if(b){treeAction(b.dataset.tv);return}
  const r=e.target.closest('.tv-row');
  if(r)treeRowAct(r,'tap');
});

function treeHoverAt(x,y){
  if(!tree)return;
  const el=document.elementFromPoint(x,y);
  const btn=el&&el.closest('#treeView [data-tv]');
  const row=btn?null:(el&&el.closest('#treeView .tv-row'));
  const key=btn?btn.dataset.tv:(row?row.dataset.tp:null);
  if(key===tree.hl)return;
  clearTimeout(treeHoverT);treeHoverT=null;
  tree.hl=key;
  treeApplyHl();
  if(key)haptic('tick');
  if(row&&row.dataset.tt==='d'&&!tree.open.has(key)){
    treeHoverT=setTimeout(()=>{
      treeHoverT=null;
      if(!tree||tree.hl!==key)return;
      tree.open.add(key);
      renderTree();
    },280);
  }
}
function treeAutoScroll(d){
  treeScrollDir=d;
  if(!d){clearInterval(treeScrollT);treeScrollT=null;return}
  if(treeScrollT)return;
  treeScrollT=setInterval(()=>{
    if(!tree||!treeScrollDir){treeAutoScroll(0);return}
    pbody.scrollTop+=treeScrollDir*7;
    treeHoverAt(treeLast.x,treeLast.y);
  },20);
}
function treeSlideMove(e){
  treeLast={x:e.clientX,y:e.clientY};
  const pr=pbody.getBoundingClientRect();
  const hdr=treeView.querySelector('.tv-hdr');
  const topEdge=hdr?hdr.getBoundingClientRect().bottom:pr.top;
  let d=0;
  if(e.clientY>=topEdge&&e.clientY<topEdge+34)d=-1;
  else if(e.clientY>pr.bottom-44&&e.clientY<=pr.bottom)d=1;
  treeAutoScroll(d);
  treeHoverAt(e.clientX,e.clientY);
}
function treeSlideRelease(e){
  treeAutoScroll(0);
  clearTimeout(treeHoverT);treeHoverT=null;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const btn=el&&el.closest('#treeView [data-tv]');
  const row=el&&el.closest('#treeView .tv-row');
  tree.hl=null;
  treeApplyHl();
  lastHoveredDragItem=null;
  if(btn){treeAction(btn.dataset.tv);return}
  if(row){treeRowAct(row,'release');return}
  if(!(el&&el.closest('#pop')))closePop();
}
fab.addEventListener('pointermove',e=>{
  if(!fbDrag||tree||editMode)return;
  let fid=null;
    const h=lastHoveredDragItem;
    if(h&&h.isConnected){
      const ir=h.getBoundingClientRect();
      const lim=((st.set.ringSize||52)/2)+((st.set.icon||46)/2)+22;
      if(Math.hypot(e.clientX-(ir.left+ir.width/2),e.clientY-(ir.top+ir.height/2))<=lim){
        const it=st.items.find(x=>x.id===h.dataset.id);
        if(it&&it.t==='folder')fid=it.id;
      }
    }
    if(fid===treeDwellId)return;
    clearTimeout(treeDwell);treeDwell=null;treeDwellId=fid;
    if(!fid)return;
    const dwellTime=st.set.dwellDelay!=null?st.set.dwellDelay:300;

      treeDwell=null;
      if(!fbDrag||tree||treeDwellId!==fid)return;

});

fab.addEventListener('pointercancel',()=>{clearTimeout(treeDwell);treeDwell=null;treeDwellId=null;clearTimeout(treeHoverT);treeHoverT=null;treeAutoScroll(0)});

function launch(it){

/* files & folders */
const fileIcon=p=>{const e=p.split('.').pop().toLowerCase();return/^(jpg|png|gif|webp)$/.test(e)?'fa-solid fa-image':/^(mp4|mkv)$/.test(e)?'fa-solid fa-film':/^(mp3|opus|wav)$/.test(e)?'fa-solid fa-music':e==='pdf'?'fa-solid fa-file-pdf':e==='apk'?'fa-brands fa-android':/^(html|js|css)$/.test(e)?'fa-solid fa-code':/^(xlsx|csv)$/.test(e)?'fa-solid fa-file-excel':'fa-solid fa-file-lines'};
function kids(dir){const d=new Set(),f=[];FILES.forEach(p=>{if(!p.startsWith(dir+'/'))return;const r=p.slice(dir.length+1);if(r.includes('/'))d.add(dir+'/'+r.split('/')[0]);else f.push(p)});return{dirs:[...d].sort(),files:f.sort()}}
function openFolder(dir){
  const o={n:dir.split('/').pop()||'Storage',i:'fa-solid fa-folder-open',c:'#f0a93b',sub:dir,hint:HINTS.folder};
  const body=()=>{const k=kids(dir),parent=dir.length>ROOT.length-1&&dir!==ROOT.slice(0,-1)?dir.split('/').slice(0,-1).join('/'):null;
    return`<div class="crumb">${esc(dir.replace(ROOT.slice(0,-1),'Internal storage'))}</div>`+(parent?`<div class="res" data-d="${esc(parent)}"><div class="ic" style="background:#3a3552"><i class="fa-solid fa-turn-up"></i></div><div class="tx"><b>..</b></div></div>`:'')+
    k.dirs.map(d=>`<div class="res" data-d="${esc(d)}"><div class="ic" style="background:#f0a93b"><i class="fa-solid fa-folder"></i></div><div class="tx"><b>${esc(d.split('/').pop())}</b><small>Folder</small></div></div>`).join('')+
    k.files.map(f=>`<div class="res" data-f="${esc(f)}"><div class="ic" style="background:#8f9bb3"><i class="${fileIcon(f)}"></i></div><div class="tx"><b>${esc(f.split('/').pop())}</b><small>${fsize(f)}</small></div></div>`).join('')||'<div class="empty">Empty folder</div>'};
  openSim(o,body(),b=>wireFolder(b,dir,o,body))}
function wireFolder(b,dir,o,body){b.onclick=e=>{const r=e.target.closest('.res');if(!r)return;if(r.dataset.d){dir=r.dataset.d;o.n=dir.split('/').pop();b.innerHTML=body.call?rebuild(dir):'';sim.querySelector('.st b').textContent=o.n;sim.querySelector('.st small').textContent=dir}else openFile(r.dataset.f)};
  function rebuild(d){const k=kids(d),parent=d!==ROOT.slice(0,-1)?d.split('/').slice(0,-1).join('/'):null;
    return`<div class="crumb">${esc(d.replace(ROOT.slice(0,-1),'Internal storage'))}</div>`+(parent&&parent.length>=ROOT.length-1?`<div class="res" data-d="${esc(parent)}"><div class="ic" style="background:#3a3552"><i class="fa-solid fa-turn-up"></i></div><div class="tx"><b>..</b></div></div>`:'')+k.dirs.map(x=>`<div class="res" data-d="${esc(x)}"><div class="ic" style="background:#f0a93b"><i class="fa-solid fa-folder"></i></div><div class="tx"><b>${esc(x.split('/').pop())}</b><small>Folder</small></div></div>`).join('')+k.files.map(f=>`<div class="res" data-f="${esc(f)}"><div class="ic" style="background:#8f9bb3"><i class="${fileIcon(f)}"></i></div><div class="tx"><b>${esc(f.split('/').pop())}</b><small>${fsize(f)}</small></div></div>`).join('')||'<div class="empty">Empty folder</div>'}}
function fsize(p){let h=0;for(const c of p)h=(h*31+c.charCodeAt(0))>>>0;const kb=200+h%48000;return kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB'}
function openFile(p){openSim({n:p.split('/').pop(),i:fileIcon(p),c:'#8f9bb3',sub:p.replace(ROOT,'Internal storage/'),hint:HINTS.file},
 `<div class="card" style="text-align:center;padding:34px 16px"><i class="${fileIcon(p)}" style="font-size:54px;color:var(--acc)"></i><h3 style="margin-top:14px;font-weight:600;word-break:break-all">${esc(p.split('/').pop())}</h3><p style="color:var(--dim);font-size:12.5px;margin-top:4px">${fsize(p)} · ${esc(p.split('.').pop().toUpperCase())}</p></div><p style="margin-top:14px;font-size:12px;color:var(--dim);word-break:break-all">${esc(p)}</p><p style="margin-top:10px;font-size:12.5px;color:var(--dim)">Simulated preview. The native app would hand this file to the default viewer.</p>`)}

  document.querySelectorAll('.batch-row').forEach(row=>{

    const on=batchSelected.has(pkg);
    if(chk)chk.checked=on;
    row.style.background=on?'rgba(179,32,43,.25)':'rgba(255,255,255,.04)';
    row.style.border=on?'1px solid var(--acc)':'1px solid transparent';

  $('#batchDlg').style.display='none';

$('#batchAddBtn').onclick=()=>{
  if(!batchSelected.size){
    toast('Select at least one app');
    return;
  }
  const taken=new Set(st.items.map(x=>x.slot));
  let curSlot=0;
  batchSelected.forEach(pkg=>{
    const app=INSTALLED.find(x=>x.v===pkg);
    if(!app)return;
    while(taken.has(curSlot))curSlot++;
    st.items.push({
      id:uid(),
      t:'app',
      n:app.n,
      v:app.v,
      i:app.i,
      c:app.c,
      slot:curSlot
    });
    taken.add(curSlot);
  });
  save();
  $('#batchDlg').style.display='none';
  render();
  toast(`${batchSelected.size} shortcuts added`);
};

function setDType(t,keep){dS.t=t;
  document.querySelectorAll('#dType button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const isApp=t==='app';
  const isSys=t==='system';
  const showPickerBtn=t==='file'||t==='folder';
  $('#dAppBox').style.display=isApp?'flex':'none';
  $('#dTargetBox').style.display=(!isApp&&!isSys)?'flex':'none';
  $('#dSys').style.display=isSys?'block':'none';
  $('#dPickBtn').style.display=showPickerBtn?'block':'none';
  $('#dTL').textContent=isSys?'Action':(isApp?'Application':'Target');
  $('#dTarget').placeholder=(TYPES[t]||TYPES.app).ph;
  const opts=t==='folder'?DIRS:t==='file'?FILES:[];
  $('#dl').innerHTML=opts.map(o=>`<option value="${esc(o)}">`).join('');
  const qsBox=$('#dQuickShortcutsBox');
  const qsList=$('#dQuickShortcutsList');
  const presets=QUICK_SC[t];
  if(qsBox&&qsList){
    if(presets&&presets.length){
      qsBox.style.display='flex';
      qsList.innerHTML=presets.map(p=>`<button type="button" class="sbtn" data-qs="${esc(p.n)}" style="margin:0;padding:4px 9px;font-size:11px;display:flex;align-items:center;gap:6px"><i class="${esc(p.i)}" style="color:${p.c}"></i> ${esc(p.n)}</button>`).join('');
      qsList.onclick=e=>{
        const btn=e.target.closest('[data-qs]');
        if(!btn)return;
        const p=presets.find(x=>x.n===btn.dataset.qs);
        if(!p)return;
        $('#dName').value=p.n;
        $('#dTarget').value=p.v;
        dS.i=p.i;
        dS.c=p.c;
        dS.touched=true;
        if(p.a){dS.appAction=p.a;dS.actionName=p.n;}
        buildPickers();
      };
    }else{
      qsBox.style.display='none';
      qsList.innerHTML='';
    }
  }
  if(isApp){
    const app=$('#dAppSel').value?INSTALLED.find(x=>x.v===$('#dAppSel').value)||INSTALLED[0]:INSTALLED[0];
    if(!keep){
      dS.appAction=null;
      dS.actionName=null;
      if(!dS.touched){dS.i=app.i;dS.c=app.c}
      $('#dName').value=app.n;
    }
    populateAppShortcuts(app, dS.appAction);
  }
  if(!keep&&!isApp){$('#dTarget').value='';if(!dS.touched){dS.i=(TYPES[t]||TYPES.app).icon;dS.c=(TYPES[t]||TYPES.app).color}}
  if(isSys&&!dS.touched){const s=SYS[$('#dSys').value];if(s){dS.i=s.i;dS.c=s.c}}
  buildPickers()}

$('#dAppSel').onchange=()=>{

  if(!dS.touched){

let curPickerDir=ROOT.slice(0,-1);
function openFilePicker(mode){
  curPickerDir=ROOT.slice(0,-1);
  renderPickerList(mode);
  $('#pickerDlg').style.display='flex';
}

function renderPickerList(mode){
  const dir=curPickerDir;
  const isFolderMode=mode==='folder';
  $('#pickerTitle').innerHTML=isFolderMode?'<i class="fa-solid fa-folder" style="color:var(--acc)"></i> Choose Folder':'<i class="fa-solid fa-file-lines" style="color:var(--acc)"></i> Choose File';
  $('#pickerCrumb').textContent=dir.replace(ROOT.slice(0,-1),'Internal storage');
  const selBtn=$('#pickerSelectThis');
  selBtn.style.display='block';
    selBtn.textContent=isFolderMode?'Select This Folder':'Pick File From Here';
    selBtn.onclick=()=>{
      $('#dTarget').value=dir;
      if(!$('#dName').value)$('#dName').value=dir.split('/').pop()||'Storage';
      if(isFolderMode && !dS.touched){
        dS.i='fa-solid fa-folder';
        buildPickers();
      }
      $('#pickerDlg').style.display='none';
    };
  const k=kids(dir);
  const parent=dir.length>ROOT.length-1&&dir!==ROOT.slice(0,-1)?dir.split('/').slice(0,-1).join('/'):null;
  let html='';
  if(parent){
    html+=`<div class="res" data-nav="${esc(parent)}"><div class="ic" style="background:#3a3552"><i class="fa-solid fa-turn-up"></i></div><div class="tx"><b>..</b></div></div>`;
  }
  k.dirs.forEach(d=>{
      html+=`<div class="res" data-nav="${esc(d)}"><div class="ic" style="background:#f0a93b"><i class="fa-solid fa-folder"></i></div><div class="tx"><b>${esc(d.split('/').pop())}</b><small>Folder</small></div><button class="pin" data-pick-dir="${esc(d)}" title="Select this folder" aria-label="Select folder" style="margin-left:auto"><i class="fa-solid fa-check"></i></button></div>`;
    });
  if(!isFolderMode){
    k.files.forEach(f=>{
      html+=`<div class="res" data-file="${esc(f)}"><div class="ic" style="background:#8f9bb3"><i class="${fileIcon(f)}"></i></div><div class="tx"><b>${esc(f.split('/').pop())}</b><small>${fsize(f)}</small></div></div>`;
    });
  }
  if(!html)html='<div class="empty">Folder is empty</div>';
  const list=$('#pickerList');
  list.innerHTML=html;
  list.onclick=e=>{
      const pickBtn=e.target.closest('[data-pick-dir]');
      if(pickBtn){
        e.stopPropagation();
        const folderPath=pickBtn.dataset.pickDir;
        $('#dTarget').value=folderPath;
        if(!$('#dName').value)$('#dName').value=folderPath.split('/').pop()||'Folder';
        if(!dS.touched){
          dS.i=mode==='folder'?'fa-solid fa-folder':fileIcon(folderPath);
          buildPickers();
        }
        $('#pickerDlg').style.display='none';
        return;
      }
      const res=e.target.closest('.res');
      if(!res)return;
      if(res.dataset.nav){
        curPickerDir=res.dataset.nav;
        renderPickerList(mode);
      }else if(res.dataset.file){
        const filePath=res.dataset.file;
        $('#dTarget').value=filePath;
        if(!$('#dName').value)$('#dName').value=filePath.split('/').pop();
        if(!dS.touched){
          dS.i=fileIcon(filePath);
          buildPickers();
        }
        $('#pickerDlg').style.display='none';
      }
    };
}

/* ───── custom image chooser & cropper ───── */
let cropImg=new Image(), cropState={scale:1,x:0,y:0,drag:false,sx:0,sy:0};
const cropC=$('#cropCanvas'), cropCtx=cropC.getContext('2d');

function drawCrop(){
  cropCtx.clearRect(0,0,cropC.width,cropC.height);
  if(!cropImg.src)return;
  const baseW=cropImg.width, baseH=cropImg.height;
  const aspect=baseW/baseH;
  let dw=cropC.width, dh=cropC.height;
  if(aspect>1)dw=cropC.height*aspect; else dh=cropC.width/aspect;
  const finalW=dw*cropState.scale;
  const finalH=dh*cropState.scale;
  const drawX=(cropC.width-finalW)/2+cropState.x;
  const drawY=(cropC.height-finalH)/2+cropState.y;
  cropCtx.drawImage(cropImg,drawX,drawY,finalW,finalH);

  cropCtx.fillStyle='rgba(0,0,0,0.45)';
  cropCtx.beginPath();
  cropCtx.rect(0,0,cropC.width,cropC.height);
  cropCtx.arc(cropC.width/2,cropC.height/2,90,0,Math.PI*2,true);
  cropCtx.fill('evenodd');

  cropCtx.strokeStyle='rgba(255,255,255,0.85)';
  cropCtx.lineWidth=2;
  cropCtx.strokeRect(cropC.width/2-90,cropC.height/2-90,180,180);
}

cropC.onpointerdown=e=>{
  cropState.drag=true;
  cropState.sx=e.clientX-cropState.x;
  cropState.sy=e.clientY-cropState.y;
  cropC.setPointerCapture(e.pointerId);
};
cropC.onpointermove=e=>{
  if(!cropState.drag)return;
  cropState.x=e.clientX-cropState.sx;
  cropState.y=e.clientY-cropState.sy;
  drawCrop();
};
cropC.onpointerup=cropC.onpointercancel=e=>{
  cropState.drag=false;
  try{cropC.releasePointerCapture(e.pointerId)}catch(_){}
};
$('#cropZoom').oninput=e=>{
  cropState.scale=parseFloat(e.target.value);
  drawCrop();
};

$('#dUploadIconBtn').onclick=()=>{
  $('#dImgFileInput').value='';

$('#dImgFileInput').onchange=e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    cropImg.onload=()=>{
      cropState={scale:1,x:0,y:0,drag:false,sx:0,sy:0};
      $('#cropZoom').value=1;
      drawCrop();
      $('#cropDlg').style.display='flex';
    };
    cropImg.src=ev.target.result;
  };
  r.readAsDataURL(f);
};

$('#cropCancel').onclick=()=>{$('#cropDlg').style.display='none'};
$('#cropApply').onclick=()=>{
  const outC=document.createElement('canvas');
  outC.width=256;
  outC.height=256;
  const outCtx=outC.getContext('2d');
  
  if(cropImg.src){
    const baseW=cropImg.width, baseH=cropImg.height;
    const aspect=baseW/baseH;
    let dw=cropC.width, dh=cropC.height;
    if(aspect>1) dw=cropC.height*aspect; else dh=cropC.width/aspect;
    
    const finalW=dw*cropState.scale;
    const finalH=dh*cropState.scale;
    const drawX=(cropC.width-finalW)/2+cropState.x;
    const drawY=(cropC.height-finalH)/2+cropState.y;

    const cropBoxX=cropC.width/2-90;
    const cropBoxY=cropC.height/2-90;
    const cropBoxSize=180;

    const sx=(cropBoxX-drawX)*(baseW/finalW);
    const sy=(cropBoxY-drawY)*(baseH/finalH);
    const sSize=cropBoxSize*(baseW/finalW);

    outCtx.drawImage(cropImg, sx, sy, sSize, sSize, 0, 0, 256, 256);
  }
  
  dS.customImg=outC.toDataURL('image/png');
  dS.touched=true;
  updateIconPreview();
  $('#cropDlg').style.display='none';
};

$('#dSave').onclick=()=>{
  let name=$('#dName').value.trim();
  let v=dS.t==='system'?$('#dSys').value:(dS.t==='app'?$('#dAppSel').value:$('#dTarget').value.trim());
  if(dS.t==='system'&&!name)name=SYS[v].n;
  if(dS.t==='app'&&!name){
    const a=INSTALLED.find(x=>x.v===v);
    name=dS.actionName||(a?a.n:'App');
  }
  if(!v){toast('Select a target first');return}
  if(!name){toast('Add a name first');return}
  const rec={t:dS.t,n:name,v,i:dS.i,c:dS.c,slot:dS.slot};
  if(dS.appAction)rec.appAction=dS.appAction;
  if(dS.actionName)rec.actionName=dS.actionName;
  if(dS.customImg)rec.customImg=dS.customImg;
  if(dS.id){
    const x=st.items.find(i=>i.id===dS.id);
    if(!dS.customImg)delete x.customImg;
    if(!dS.appAction)delete x.appAction;
    if(!dS.actionName)delete x.actionName;
    Object.assign(x,rec);
  }else{
    st.items=st.items.filter(x=>x.slot!==dS.slot);
    st.items.push({id:uid(),...rec});
  }
  save();$('#dlg').style.display='none';render();
  toast(dS.id?'Shortcut updated':'Shortcut added')};
