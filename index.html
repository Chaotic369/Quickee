<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14101f">
<title>Quick Launcher – Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f8f2e9; --dim:rgba(248,242,233,.62); --faint:rgba(248,242,233,.12);
  --acc:#ffc46b; --bg:#120e1f; --panel:#1b152d;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#08060c;color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
body{display:grid;place-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--ink);outline:none}

#phone{position:relative;width:100vw;height:100dvh;max-width:430px;overflow:hidden;background:#000;isolation:isolate}
#phone::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:92px;height:24px;border-radius:20px;background:#000;z-index:8;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
@media (min-width:500px){#phone{height:min(900px,96dvh);border-radius:44px;box-shadow:0 0 0 10px #1a1628,0 0 0 12px #2d2642,0 35px 85px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.1)}}

/* ───── wallpaper + home ───── */
#wall{position:absolute;inset:0;z-index:0;
  background:
   radial-gradient(circle at 50% 72%,rgba(255,217,160,.92) 0 6%,rgba(255,160,95,.8) 12%,rgba(255,120,90,0) 38%),
   radial-gradient(ellipse at 80% 20%,rgba(140,80,220,.35) 0%,transparent 50%),
   linear-gradient(180deg,#120e29 0%,#241a4a 30%,#662d5d 58%,#d45952 82%,#f59e56 100%);}
#wall::after{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:25%;
  background:linear-gradient(180deg,rgba(40,20,50,.92),#0e0817);clip-path:polygon(0 38%,14% 22%,30% 40%,46% 16%,64% 36%,80% 20%,100% 38%,100% 100%,0 100%);filter:drop-shadow(0 -4px 14px rgba(0,0,0,.45))}
#dim{position:absolute;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none;transition:opacity .15s}
#status{position:absolute;top:0;left:0;right:0;height:34px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;pointer-events:none}
#status .r{display:flex;gap:8px;align-items:center;font-size:11px}
#home{position:absolute;inset:0;z-index:2;padding:56px 22px 0}
#clock{font-size:78px;line-height:0.95;font-weight:200;letter-spacing:-4px;text-shadow:0 6px 24px rgba(0,0,0,.35);background:linear-gradient(180deg,#fff 20%,rgba(255,255,255,.7));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#date{margin-top:8px;font-size:13.5px;color:rgba(246,239,228,.85);font-weight:500;letter-spacing:.2px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
#homeGrid{margin-top:36px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.hi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hi .ic{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:22px;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.35);transition:transform .15s cubic-bezier(.2,0,0,1)}
.hi:active .ic{transform:scale(.9)}
#dock{position:absolute;left:14px;right:14px;bottom:26px;height:76px;border-radius:30px;z-index:2;background:rgba(20,14,36,.42);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);display:flex;justify-content:space-around;align-items:center}
#dock .ic{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:21px;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.35);transition:transform .15s cubic-bezier(.2,0,0,1)}
#dock .ic:active{transform:scale(.9)}
#navpill{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4.5px;border-radius:4px;background:rgba(255,255,255,.75);box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:6}

/* ───── side line trigger & external floating controls ───── */
#fab{position:absolute;z-index:45;width:var(--trig-w,6px);height:var(--trig-h,90px);border-radius:4px 0 0 4px;touch-action:none;user-select:none;
  background:rgba(255,255,255,.32);box-shadow:none;transition:width .18s,background .2s;color:transparent}
#fab i{display:none}
#fab:hover,#fab:active,#fab.open{width:calc(var(--trig-w,6px) + 4px);background:rgba(255,255,255,.55);box-shadow:none}
.fbtn{position:absolute;z-index:45;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;color:var(--ink);
  background:rgba(27,22,41,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(255,255,255,.14);
  opacity:0;pointer-events:none;transform:scale(.7);transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.34,1.56,.64,1),color .15s}
.fbtn.open{opacity:1;pointer-events:auto;transform:scale(1)}
.fbtn.open:hover{transform:scale(1.3);z-index:55}
.fbtn:active{transform:scale(.95)}
.fbtn.on{color:var(--acc);box-shadow:0 0 0 1.5px var(--acc)}
#fabAdd{display:none}
#fabAdd.show{display:grid}
.dt-ring{position:absolute;z-index:999;width:var(--ring-sz,52px);height:var(--ring-sz,52px);border-width:var(--ring-th,2.5px);border-style:solid;border-color:var(--ring-col,rgba(255,255,255,.75));border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;background:var(--ring-bg,rgba(255,255,255,.14));box-shadow:none}
.it.drag-over .ic{transform:scale(1.35);box-shadow:inset 0 1px 1px rgba(255,255,255,.4);z-index:10}
#scrim{position:absolute;inset:0;z-index:38;display:none}
#scrim.on{display:block}

/* ───── popup ───── */
#pop{
  --icon:50px;--rad:30;--cols:4;--cgap:10px;--rgap:14px;--pad:14px;--lbl:10.5px;--glass:.74;
  position:absolute;z-index:40;display:flex;flex-direction:column;overflow:hidden;
  border-radius:26px;background:rgba(20,15,35,var(--glass));backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);
  box-shadow:0 26px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14),inset 0 1px 1px rgba(255,255,255,.2);
  opacity:0;transform:scale(.92) translateX(12px);pointer-events:none;transition:opacity .18s cubic-bezier(.16,1,.3,1),transform .18s cubic-bezier(.16,1,.3,1)}
#pop.open{opacity:1;transform:none;pointer-events:auto}
.top-bar{display:flex;align-items:center;gap:8px;padding:10px var(--pad) 0;flex-shrink:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.mbtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;color:var(--dim);transition:all .15s;flex-shrink:0}
.mbtn:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.mbtn.on{background:rgba(255,196,107,.18);color:var(--acc)}
.menu-pop{position:absolute;top:calc(var(--pad) + 38px);right:var(--pad);z-index:50;min-width:180px;background:rgba(27,21,45,.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:0 16px 36px rgba(0,0,0,.5);padding:6px;display:none;flex-direction:column;gap:2px}
.menu-pop.open{display:flex}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;font-size:12.5px;font-weight:600;color:var(--ink);transition:background .12s;text-align:left;width:100%}
.menu-item:hover{background:rgba(255,255,255,.08)}
.menu-item:active{background:rgba(255,196,107,.18);color:var(--acc)}
.menu-item i{width:16px;text-align:center;font-size:13px;color:var(--acc)}
.menu-sep{height:1px;background:rgba(255,255,255,.06);margin:4px 0}
.set-hdr{display:flex;align-items:center;gap:10px;padding:4px 0 14px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px;font-size:13.5px;font-weight:700}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 13px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--dim);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);transition:all .15s}
.chip:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.chip.on{background:var(--acc);color:#1c1304;border-color:transparent}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:var(--pad);scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
#grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows,auto),minmax(0,auto));column-gap:var(--cgap);row-gap:var(--rgap);width:100%}
.grid-cell{position:relative;width:100%;min-height:calc(var(--icon) + 18px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.edit .grid-cell{border:1.5px dashed rgba(255,255,255,.16);border-radius:calc(var(--icon)*var(--rad)/100 + 4px);min-height:calc(var(--icon) + 24px);background:rgba(255,255,255,.02);transition:border-color .15s,background .15s}
.edit .grid-cell.cell-over{border-color:var(--acc);background:rgba(255,196,107,.12)}
.cell-add{display:none;width:100%;aspect-ratio:1;border-radius:calc(var(--icon)*var(--rad)/100);place-items:center;color:rgba(255,255,255,.4);font-size:16px;cursor:pointer;transition:all .15s}
.cell-add:hover{color:var(--acc);background:rgba(255,196,107,.1)}
.edit .grid-cell.empty-slot .cell-add{display:grid}
.it{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;width:100%;cursor:pointer}
.it .ic{position:relative;width:100%;aspect-ratio:1;border-radius:calc(var(--icon)*var(--rad)/100);display:grid;place-items:center;color:#fff;font-size:calc(var(--icon)*.44);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.3);transition:transform .14s cubic-bezier(.2,0,0,1),box-shadow .2s}
.it .ic b{font-weight:700;font-size:calc(var(--icon)*.46)}
.it:active .ic{transform:scale(.95)}
.it .lb{max-width:100%;font-size:var(--lbl);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;font-weight:500;color:rgba(246,239,228,.9)}
.nolbl .it .lb{display:none}
.it.on .ic{box-shadow:0 0 0 2.5px var(--acc),0 6px 16px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.4)}
.it.lift{opacity:.25}
.it .x{display:none;position:absolute;top:-6px;right:calc(50% - var(--icon)/2 - 6px);width:20px;height:20px;border-radius:50%;background:#e5534b;color:#fff;font-size:11px;place-items:center;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.5);border:1.5px solid #1b1629;cursor:pointer}
.edit .it .x{display:grid}
.edit .it .ic{animation:none}
@media (prefers-reduced-motion:reduce){.edit .it .ic{animation:none}#pop,#fab i{transition:none}}
.ghost{position:fixed;z-index:200;pointer-events:none;transform:scale(1.15);filter:drop-shadow(0 16px 24px rgba(0,0,0,.6))}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);font-size:13px;padding:26px 8px;line-height:1.5}

.res{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;transition:background .12s;cursor:pointer}
.res:hover{background:rgba(255,255,255,.05)}
.res:active{background:rgba(255,255,255,.1)}
.res .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:16px;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 1px 1px rgba(255,255,255,.3)}
.res .tx{flex:1;min-width:0}
.res .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tx small{display:block;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.res .pin{width:32px;height:32px;border-radius:10px;color:var(--dim);font-size:12px;display:grid;place-items:center;transition:all .12s}
.res .pin:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.res .pin:active{background:rgba(255,196,107,.2);color:var(--acc)}
.rh{font-size:11px;color:var(--dim);font-weight:600;padding:8px 6px 2px}

#settings{display:none}
.sg{margin-bottom:14px}
.sg .row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;margin-bottom:6px}
.sg .row span:last-child{color:var(--acc);font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:6px;background:rgba(255,255,255,.15)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--acc);margin-top:-6.5px;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 2px rgba(20,16,31,.9)}
input[type=range]::-moz-range-track{height:5px;border-radius:6px;background:rgba(255,255,255,.15)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:2px solid rgba(20,16,31,.9);border-radius:50%;background:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:500;margin:10px 0 16px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)}
.tg{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;transition:background .2s;cursor:pointer}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s cubic-bezier(.2,0,0,1)}
.tg.on{background:var(--acc)}.tg.on::after{transform:translateX(20px);background:#201402}
.sbtn{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);font-size:12.5px;font-weight:600;margin-right:8px;transition:all .15s}
.sbtn:hover{background:rgba(255,255,255,.15);color:#fff}
.sbtn:active{transform:scale(.96)}
.rz{position:absolute;right:0;bottom:0;width:34px;height:34px;touch-action:none;cursor:nwse-resize;z-index:50;display:flex;align-items:flex-end;justify-content:flex-end;padding:4px}
.rz::after{content:"";display:block;width:14px;height:14px;border-right:3px solid var(--acc);border-bottom:3px solid var(--acc);border-bottom-right-radius:8px;box-shadow:2px 2px 6px rgba(0,0,0,.6)}
.trig-handle{display:none;position:absolute;right:100%;z-index:48;touch-action:none;user-select:none;align-items:center;justify-content:center;color:#fff}
.trig-handle.end-cap{width:22px;height:24px;background:#3a3842;border:1px solid rgba(255,255,255,.2);clip-path:polygon(0% 25%, 65% 25%, 100% 50%, 65% 75%, 0% 75%);cursor:ns-resize}
.trig-handle.top-cap{top:-12px}
.trig-handle.bot-cap{bottom:-12px}
.trig-handle.width-tab{top:50%;transform:translateY(-50%);width:26px;height:26px;background:transparent;cursor:ew-resize;font-size:13px;letter-spacing:-1px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.edit #fab .trig-handle{display:flex}
.pop-bottom-bar{display:none;position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:46px;height:14px;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize;z-index:50;user-select:none}
.pop-bottom-bar::after{content:"";width:32px;height:4.5px;border-radius:3px;background:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.edit #pop .pop-bottom-bar{display:flex}

/* ───── simulated app window ───── */
#sim{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);opacity:0;pointer-events:none;transition:transform .24s cubic-bezier(.2,.8,.2,1),opacity .2s}
#sim.on{transform:none;opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;gap:12px;padding:44px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sh .sb{width:36px;height:36px;border-radius:12px;background:var(--faint);transition:background .15s}
.sh .sb:hover{background:rgba(255,255,255,.16)}
.sh .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.3)}
.sh .st b{display:block;font-size:15px}.sh .st small{display:block;font-size:11px;color:var(--dim);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{flex:1;overflow-y:auto;padding:6px 16px 16px}
.nat{padding:10px 16px 18px;font-size:10.5px;color:var(--dim);background:rgba(255,255,255,.04);line-height:1.4}
.nat b{color:var(--acc);font-weight:600}
.crumb{font-size:11.5px;color:var(--dim);padding:4px 0 10px;word-break:break-all}
.skel{height:14px;border-radius:7px;background:rgba(255,255,255,.08);margin:10px 0}
.card{border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bigbtn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:14px;background:var(--acc);color:#2a1b05;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .12s}
.bigbtn:active{transform:scale(.96)}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;margin:6px 0;font-size:13.5px;line-height:1.35}
.bub.me{margin-left:auto;background:#2fb872;color:#04210f;border-bottom-right-radius:4px}
.bub.th{background:rgba(255,255,255,.1);border-bottom-left-radius:4px}
.cinput{display:flex;gap:8px;padding:10px 12px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.06)}
.cinput input{flex:1;background:rgba(255,255,255,.09);border:0;border-radius:14px;padding:0 14px;height:42px}
.cinput button{width:42px;height:42px;border-radius:14px;background:#2fb872;color:#04210f}
.callw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;text-align:center}
.callw .av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:#3cc47c;color:#06240f;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.callw .end{width:64px;height:64px;border-radius:50%;background:#e5534b;color:#fff;font-size:22px;margin-top:40px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .15s}
.callw .end:active{transform:scale(.92)}
.burl{display:flex;align-items:center;gap:10px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);padding:0 14px;font-size:12.5px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07)}
.burl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe.pv{width:100%;height:360px;border:0;border-radius:14px;background:#fff;margin-top:12px}

/* ───── overlays ───── */
.ov{position:absolute;inset:0;display:none}
#off{z-index:100;background:#000;align-items:flex-end;justify-content:center;padding-bottom:70px;color:#555;font-size:12px}
#off span{animation:fade 2.6s forwards}@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}
#lock{z-index:90;background:linear-gradient(180deg,rgba(10,8,22,.55),rgba(10,8,22,.85)),#14101f;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);flex-direction:column;align-items:center;padding-top:120px;text-align:center}
#lock .t{font-size:88px;font-weight:200;letter-spacing:-4px;text-shadow:0 4px 20px rgba(0,0,0,.4)}
#lock small{color:var(--dim);margin-top:6px;font-size:14px;font-weight:500}
#lock .u{position:absolute;bottom:56px;color:var(--dim);font-size:12px;letter-spacing:.3px}
#recents{z-index:65;background:rgba(10,8,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);align-items:center;gap:16px;padding:0 24px;overflow-x:auto}

function endDrag(){
  if(!dr)return;
  clearTimeout(dr.t);
  document.querySelectorAll('.grid-cell.cell-over').forEach(c=>c.classList.remove('cell-over'));
  if(dr.on){
    const item=st.items.find(x=>x.id===dr.it.dataset.id);
    if(item&&typeof dr.targetSlot==='number'&&!isNaN(dr.targetSlot)){
      const occupant=st.items.find(x=>x.slot===dr.targetSlot&&x.id!==item.id);
      if(occupant){
        occupant.slot=item.slot;
      }
      item.slot=dr.targetSlot;
      save();

    dr.ghost.remove();
    dr.it.classList.remove('lift');

  const body=()=>{const k=kids(dir),parent=dir.length>ROOT.length-1&&dir!==ROOT.slice(0,-1)?dir.split('/').slice(0,-1).join('/'):null;
    return`<div class="crumb">${esc(dir.replace(ROOT.slice(0,-1),'Internal storage'))}</div>`+(parent?`<div class="res" data-d="${esc(parent)}"><div class="ic" style="background:#3a3552"><i class="fa-solid fa-turn-up"></i></div><div class="tx"><b>..</b></div></div>`:'')+
    k.dirs.map(d=>`<div class="res" data-d="${esc(d)}"><div class="ic" style="background:#f0a93b"><i class="fa-solid fa-folder"></i></div><div class="tx"><b>${esc(d.split('/').pop())}</b><small>Folder</small></div></div>`).join('')+
    k.files.map(f=>`<div class="res" data-f="${esc(f)}"><div class="ic" style="background:#8f9bb3"><i class="${fileIcon(f)}"></i></div><div class="tx"><b>${esc(f.split('/').pop())}</b><small>${fsize(f)}</small></div></div>`).join('')||'<div class="empty">Empty folder</div>'};
  openSim(o,body(),b=>wireFolder(b,dir,o,body))}
function wireFolder(b,dir,o,body){b.onclick=e=>{const r=e.target.closest('.res');if(!r)return;if(r.dataset.d){dir=r.dataset.d;o.n=dir.split('/').pop();b.innerHTML=body.call?rebuild(dir):'';sim.querySelector('.st b').textContent=o.n;sim.querySelector('.st small').textContent=dir}else openFile(r.dataset.f)};
  function rebuild(d){const k=kids(d),parent=d!==ROOT.slice(0,-1)?d.split('/').slice(0,-1).join('/'):null;
    return`<div class="crumb">${esc(d.replace(ROOT.slice(0,-1),'Internal storage'))}</div>`+(parent&&parent.length>=ROOT.length-1?`<div class="res" data-d="${esc(parent)}"><div class="ic" style="background:#3a3552"><i class="fa-solid fa-turn-up"></i></div><div class="tx"><b>..</b></div></div>`:'')+k.dirs.map(x=>`<div class="res" data-d="${esc(x)}"><div class="ic" style="background:#f0a93b"><i class="fa-solid fa-folder"></i></div><div class="tx"><b>${esc(x.split('/').pop())}</b><small>Folder</small></div></div>`).join('')+k.files.map(f=>`<div class="res" data-f="${esc(f)}"><div class="ic" style="background:#8f9bb3"><i class="${fileIcon(f)}"></i></div><div class="tx"><b>${esc(f.split('/').pop())}</b><small>${fsize(f)}</small></div></div>`).join('')||'<div class="empty">Empty folder</div>'}}
function fsize(p){let h=0;for(const c of p)h=(h*31+c.charCodeAt(0))>>>0;const kb=200+h%48000;return kb>1024?(kb/1024).toFixed(1)+' MB':kb+' KB'}
function openFile(p){openSim({n:p.split('/').pop(),i:fileIcon(p),c:'#8f9bb3',sub:p.replace(ROOT,'Internal storage/'),hint:HINTS.file},
 `<div class="card" style="text-align:center;padding:34px 16px"><i class="${fileIcon(p)}" style="font-size:54px;color:var(--acc)"></i><h3 style="margin-top:14px;font-weight:600;word-break:break-all">${esc(p.split('/').pop())}</h3><p style="color:var(--dim);font-size:12.5px;margin-top:4px">${fsize(p)} · ${esc(p.split('.').pop().toUpperCase())}</p></div><p style="margin-top:14px;font-size:12px;color:var(--dim);word-break:break-all">${esc(p)}</p><p style="margin-top:10px;font-size:12.5px;color:var(--dim)">Simulated preview. The native app would hand this file to the default viewer.</p>`)}

/* websites */
function openWeb(url,title){
  openSim({n:title||url.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],i:'fa-solid fa-globe',c:'#4aa3ff',sub:url,hint:HINTS.web},
  `<div class="burl"><i class="fa-solid fa-lock" style="font-size:11px;color:var(--dim)"></i><span>${esc(url)}</span></div><div class="card"><div class="skel" style="width:55%;height:20px"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div><p style="margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.5">In the native app this opens in your default browser. Here you can open the real page in a new tab, or try an inline preview (many sites block this).</p><button class="bigbtn" id="wOpen">Open in new tab</button> <button class="bigbtn" id="wPrev" style="background:rgba(255,255,255,.12);color:var(--ink)">Inline preview</button><div id="pvh"></div>`,
  b=>{$('#wOpen').onclick=()=>window.open(url,'_blank','noopener');$('#wPrev').onclick=()=>{$('#pvh').innerHTML=`<iframe class="pv" sandbox="allow-scripts allow-forms" src="${esc(url)}"></iframe>`}})}

/* ───────── system action UIs ───────── */
function screenOff(){closeLayers();const o=$('#off');o.style.display='flex';const s=o.querySelector('span');s.style.animation='none';void s.offsetWidth;s.style.animation=''}
$('#off').addEventListener('pointerdown',()=>{$('#off').style.display='none';toast('Screen on')});
function showLock(){closePop();$('#lock').style.display='flex'}
$('#lock').addEventListener('pointerdown',()=>{$('#lock').style.display='none'});
function shot(){closePop();const f=$('#flash');f.style.transition='none';f.style.opacity='.9';requestAnimationFrame(()=>{f.style.transition='opacity .4s';f.style.opacity='0'});setTimeout(()=>toast('Screenshot saved','Pictures/Screenshots'),250)}
function showRecents(){closePop();const r=$('#recents');r.innerHTML=['Chrome','Maps','Notes'].map(n=>{const a=INSTALLED.find(x=>x.n===n);return`<div class="rc"><div class="rh2"><span class="ic" style="background:${a.c}"><i class="${a.i}"></i></span>${a.n}</div><div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div></div>`}).join('');r.style.display='flex'}
$('#recents').addEventListener('click',e=>{if(e.target.id==='recents'||e.target.closest('.rc'))$('#recents').style.display='none'});
function showNotif(){closePop();const n=$('#notif');n.innerHTML='<div style="font-size:12px;color:var(--dim);margin-bottom:4px">Notifications</div><div class="nc"><b>Sam</b>Are you free later?</div><div class="nc"><b>Calendar</b>Design review in 30 min</div><div class="nc"><b>GitHub</b>Build #214 passed</div><div class="nc"><b>Mom</b>Missed call</div>';n.style.display='flex'}
$('#notif').addEventListener('click',()=>{$('#notif').style.display='none'});
function powerMenu(){closePop();const sc=$('#sheetC');sc.innerHTML=`<h4><i class="fa-solid fa-power-off"></i>Power</h4><div class="pw"><button id="pOff"><i class="fa-solid fa-power-off" style="color:#ff7b72"></i>Power off</button><button id="pRe"><i class="fa-solid fa-rotate"></i>Restart</button><button id="pSh"><i class="fa-solid fa-expand"></i>Screenshot</button><button id="pLk"><i class="fa-solid fa-lock"></i>Lock</button></div>`;$('#sheet').style.display='flex';
  $('#pOff').onclick=()=>{closeSheet();screenOff();$('#off span').textContent='Powered off · tap to boot'};
  $('#pRe').onclick=()=>{closeSheet();screenOff();$('#off span').textContent='Restarting…';setTimeout(()=>{$('#off').style.display='none';toast('Booted')},1800)};
  $('#pSh').onclick=()=>{closeSheet();shot()};$('#pLk').onclick=()=>{closeSheet();showLock()}}
function slider(t,ic,val,fn){closePop();const sc=$('#sheetC');sc.innerHTML=`<h4><i class="${ic}"></i>${t}<span id="sv" style="margin-left:auto;color:var(--acc)">${val}%</span></h4><input type="range" min="0" max="100" value="${val}" id="sl">`;$('#sheet').style.display='flex';$('#sl').oninput=e=>{$('#sv').textContent=e.target.value+'%';fn(+e.target.value)}}
function closeSheet(){$('#sheet').style.display='none';$('#off span').textContent='Screen off · tap to wake'}
$('#sheet').addEventListener('pointerdown',e=>{if(e.target.id==='sheet')closeSheet()});

/* ───────── add / edit dialog ───────── */
let dS=null;
function openDlg(item,targetSlot){
  const destSlot=(item&&typeof item.slot==='number')?item.slot:(typeof targetSlot==='number'?targetSlot:firstFreeSlot());
  dS=item?{id:item.id,slot:destSlot,t:item.t,i:item.i,c:item.c,touched:true}:{id:null,slot:destSlot,t:'app',i:TYPES.app.icon,c:TYPES.app.color,touched:false};
  $('#dT').textContent=item?'Edit shortcut':'New shortcut';
  $('#dName').value=item?item.n:'';
  $('#dDel').style.display=item?'block':'none';
  $('#dSys').innerHTML=Object.keys(SYS).map(k=>`<option value="${k}">${SYS[k].n}</option>`).join('');
  $('#dType').innerHTML=Object.keys(TYPES).map(t=>`<button data-t="${t}">${TYPES[t].label}</button>`).join('');
  setDType(dS.t,true);
  if(item){if(item.t==='system')$('#dSys').value=item.v;else $('#dTarget').value=item.v}
  buildPickers();$('#dlg').style.display='flex'}
function setDType(t,keep){dS.t=t;
  document.querySelectorAll('#dType button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const sys=t==='system';$('#dSys').style.display=sys?'block':'none';$('#dTarget').style.display=sys?'none':'block';
  $('#dTL').textContent=sys?'Action':'Target';$('#dTarget').placeholder=(TYPES[t]||TYPES.app).ph;
  const opts=t==='app'?INSTALLED.map(a=>a.n):t==='folder'?DIRS:t==='file'?FILES:[];
  $('#dl').innerHTML=opts.map(o=>`<option value="${esc(o)}">`).join('');
  if(!keep){$('#dTarget').value='';if(!dS.touched){dS.i=(TYPES[t]||TYPES.app).icon;dS.c=(TYPES[t]||TYPES.app).color}}
  if(sys&&!dS.touched){const s=SYS[$('#dSys').value];if(s){dS.i=s.i;dS.c=s.c}}
  buildPickers()}
function buildPickers(){
  $('#dIcons').innerHTML=ICONS.map(i=>`<button data-i="${i}" class="${i===dS.i?'on':''}">${i==='letter'?'<b>Aa</b>':`<i class="${i}"></i>`}</button>`).join('');
  $('#dCols').innerHTML=COLORS.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===dS.c?'on':''}" aria-label="${c}"></button>`).join('')}
$('#dType').onclick=e=>{const b=e.target.closest('button');if(b)setDType(b.dataset.t)};
$('#dIcons').onclick=e=>{const b=e.target.closest('button');if(b){dS.i=b.dataset.i;dS.touched=true;buildPickers()}};
$('#dCols').onclick=e=>{const b=e.target.closest('button');if(b){dS.c=b.dataset.c;dS.touched=true;buildPickers()}};
$('#dSys').onchange=()=>{const s=SYS[$('#dSys').value];if(!$('#dName').value||Object.values(SYS).some(x=>x.n===$('#dName').value))$('#dName').value=s.n;if(!dS.touched){dS.i=s.i;dS.c=s.c;buildPickers()}};
$('#dTarget').addEventListener('change',()=>{if(dS.t!=='app')return;const a=INSTALLED.find(x=>x.n.toLowerCase()===$('#dTarget').value.trim().toLowerCase());if(a){$('#dTarget').value=a.v;if(!$('#dName').value)$('#dName').value=a.n;if(!dS.touched){dS.i=a.i;dS.c=a.c;buildPickers()}}});
$('#dCancel').onclick=()=>{$('#dlg').style.display='none'};
$('#dDel').onclick=()=>{st.items=st.items.filter(x=>x.id!==dS.id);save();$('#dlg').style.display='none';render()};
$('#dSave').onclick=()=>{
  let name=$('#dName').value.trim(),v=dS.t==='system'?$('#dSys').value:$('#dTarget').value.trim();
  if(dS.t==='system'&&!name)name=SYS[v].n;
  if(!v){toast('Add a target first');return}
  if(!name){toast('Add a name first');return}
  const rec={t:dS.t,n:name,v,i:dS.i,c:dS.c,slot:dS.slot};
  if(dS.id){
    const x=st.items.find(i=>i.id===dS.id);
    Object.assign(x,rec);
  }else{
    st.items=st.items.filter(x=>x.slot!==dS.slot);
    st.items.push({id:uid(),...rec});
  }
  save();$('#dlg').style.display='none';render();
  toast(dS.id?'Shortcut updated':'Shortcut added')};


/* ───────── keyboard + resize + init ───────── */
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#dlg').style.display==='flex'){$('#dlg').style.display='none'}else if(sim.classList.contains('on'))closeSim();else if(stOn())closeStudio();else if(isOpen())closePop()});
window.addEventListener('resize',()=>{placeFab();applySet();placePop();if(stOn())pvUpdate()});
$('#dlg').style.display='none';
statusIcons();applyBright();applySet();placeFab();
})();
</script>
</body>
